name: Package Tongyi Plugin (Artifact)

on:
  workflow_dispatch:
  push:
    paths:
      - "models/tongyi/**"
      - ".github/workflows/package-tongyi.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dify Plugin CLI (Linux amd64)
        run: |
          set -euxo pipefail
          curl -L "https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64" -o dify
          chmod +x dify
          ./dify version

      - name: Package Tongyi
        run: |
          set -euxo pipefail
          ./dify plugin package ./models/tongyi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongyi-plugin-package
          path: |
            **/*.difypkg
            **/*.zip
          if-no-files-found: error